frames orbFloat2{0%{transform:translate(0,0) scale(1)}50%{transform:translate(-35px,30px) scale(1.2)}}@keyframes scanline{0%{transform:translateY(0);opacity:0}20%,80%{opacity:.7}}@keyframes pulseCard{0%{opacity:.35;transform:scale(1)}50%{opacity:.65;transform:scale(1.02)}}@keyframes floatPill{0%{transform:translateY(0)}50%{transform:translateY(-4px)}}.orb-1{animation:orbFloat1 10s ease-in-out infinite}.orb-2{animation:orbFloat2 12s ease-in-out infinite}.scan-bar{animation:scanline 6s linear infinite}.card-pulse{animation:pulseCard 7s ease-in-out infinite;transform-origin:center}.pill-anim-1{animation:floatPill 4s ease-in-out infinite}.pill-anim-2{animation:floatPill 4.5s ease-in-out .5s infinite}.pill-anim-3{animation:floatPill 5s ease-in-out 1s infinite}.pill-anim-4{animation:floatPill 4.8s ease-in-out 1.5s infinite}.pill-text,.sub-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title-text{font-weight:800;letter-spacing:-.5px}.sub-text{font-weight:400}.pill-text{font-weight:600;font-size:13px}</style><rect width="1200" height="420" fill="url(#bgGrad)" rx="16"/><g opacity=".38"><circle cx="220" cy="110" r="140" fill="#0284c7" class="orb-1" filter="url(#glowCyan)"/><circle cx="980" cy="300" r="160" fill="#7c3aed" class="orb-2" filter="url(#glowPurple)"/><circle cx="1020" cy="90" r="110" fill="#06b6d4" class="orb-1" filter="url(#glowCyan)"/></g><g stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"><line x1="0" x2="1200" y1="60" y2="60"/><line x1="0" x2="1200" y1="120" y2="120"/><line x1="0" x2="1200" y1="180" y2="180"/><line x1="0" x2="1200" y1="240" y2="240"/><line x1="0" x2="1200" y1="300" y2="300"/><line x1="0" x2="1200" y1="360" y2="360"/><line x1="150" x2="150" y1="0" y2="420"/><line x1="300" x2="300" y1="0" y2="420"/><line x1="450" x2="450" y1="0" y2="420"/><line x1="600" x2="600" y1="0" y2="420"/><line x1="750" x2="750" y1="0" y2="420"/><line x1="900" x2="900" y1="0" y2="420"/><line x1="1050